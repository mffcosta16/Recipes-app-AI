spring.application.name=recipes-app
server.port=8081

# Datasource is intentionally NOT configured here: the spring-boot-docker-compose
# module starts docker-compose.yml's postgres service on run and auto-wires the
# datasource (host/port/db/credentials) from the running container.

# Docker Compose support is skipped in tests by default; enable it so @SpringBootTest
# (e.g. contextLoads) can start/reuse the postgres service and get a wired datasource.
spring.docker.compose.skip.in-tests=false

# No schema management tool wired up yet (Flyway comes with the persistence layer) -
# Hibernate must not touch the schema in the meantime.
spring.jpa.hibernate.ddl-auto=none
# Keeps lazy-loading out of the web layer, consistent with onion/clean architecture
# (controllers must not trigger DB access via open Hibernate sessions).
spring.jpa.open-in-view=false